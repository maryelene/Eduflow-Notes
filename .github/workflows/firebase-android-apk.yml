name: Firebase Rules & Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FIRESTORE_DATABASE_ID: ai-studio-android-eduflown-a6bee6e7-cae2-4f23-a85a-77dbd7638aae
  FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
  GCP_PROJECT: demo-no-project

jobs:
  firestore-emulator-tests:
    name: Verify Firestore Rules (Port 8085)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21 (Required for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firebase CLI & Rules Test Dependencies
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase

      - name: Run Firestore Emulator & Security Rules Tests
        run: |
          npx firebase emulators:exec \
            --config firebase.json \
            --only firestore \
            --project "$GCP_PROJECT" \
            "node --test firestore.test.js"

  compile-apk:
    name: Compile EduFlow Notes APK
    needs: firestore-emulator-tests
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (AGP 9.1.1 / Kotlin 2.4.21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets & Google Services Config
        run: |
          chmod +x ./gradlew
          [ -f .env ] || cp .env.example .env
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Create Debug Keystore (debugConfig)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eduflow-notes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Signed Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: eduflow-notes-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  deploy-firebase-rules:
    name: Deploy Firestore Rules to Named Database
    needs: compile-apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Rules to ai-studio-android-eduflown-a6bee6e7-cae2-4f23-a85a-77dbd7638aae
        if: env.FIREBASE_PROJECT_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/service-account.json"
          npx -y firebase-tools deploy \
            --config firebase.json \
            --only firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          rm -f service-account.json
